name: phd_personal
description: PHD Personal - Gestão para Personal Trainers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # Backend
  supabase_flutter: ">=2.3.4 <2.7.0"

  # Notifications
  flutter_local_notifications: ^17.0.0

  # UI
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  image_picker: ^1.0.7
  file_picker: ^8.0.7

  # Utils
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  mask_text_input_formatter: ^2.9.0
  google_fonts: ^6.1.0
  timezone: ^0.9.0
  video_player: ^2.9.2
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app.png"
  remove_alpha_ios: true
  # Preto, não branco: o ícone é uma peça escura com brilho vermelho, e o
  # fundo branco de antes vinha da marca volt — aparecia como moldura
  # clara em volta nos aparelhos que recortam em círculo.
  adaptive_icon_background: "#000000"
  # Arte própria para o adaptativo. O Android recorta em círculo, gota ou
  # quadrado arredondado conforme o aparelho, e só os 61% centrais são
  # garantidos — usar a mesma `app.png` cortaria as laterais do logo.
  adaptive_icon_foreground: "assets/images/app_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app.png"
    background_color: "#0A0A0B"
    theme_color: "#0A0A0B"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
